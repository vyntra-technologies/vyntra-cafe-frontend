<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MILO & Vyntra Haute Cuisine — An immersive gastronomic experience. Artisanal roasts, Michelin-inspired dining, and atmospheric luxury." />
    <meta name="theme-color" content="#0B0B0B" />
    <title>VYNTRA CAFE HAUTE GASTRONOMIE</title>
    <!-- Premium Fonts: Playfair Display, Cormorant Garamond, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Smooth Scroll & Award-Winning Luxury Customizations */
      html {
        scroll-behavior: smooth;
        background-color: #0B0B0B;
      }
      ::selection {
        background: #D4A853;
        color: #0B0B0B;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0B0B0B;
      }
      ::-webkit-scrollbar-thumb {
        background: #2A2A2E;
        border-radius: 4px;
        border: 2px solid #0B0B0B;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D4A853;
      }
      .font-editorial {
        font-family: 'Playfair Display', Georgia, serif;
      }
      .font-garamond {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      /* Cinematic clip path reveals */
      .clip-reveal {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        transition: clip-path 1.2s cubic-bezier(0.19, 1, 0.22, 1);
      }
      .clip-hidden {
        clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
      }
      /* Subtle noise grain for luxury texture */
      .bg-grain {
        background-image: radial-gradient(rgba(212, 168, 83, 0.03) 1px, transparent 0);
        background-size: 24px 24px;
      }
      /* Shimmer text */
      @keyframes goldShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .gold-shimmer-text {
        background: linear-gradient(90deg, #D4A853 0%, #FFF3D6 50%, #D4A853 100%);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: goldShimmer 6s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
